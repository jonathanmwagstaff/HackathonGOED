<body>

<div id="overlay">

<!-- ─────────────────────────────────────────────────
     GPGPU: Position update shader
     w-channel stores phase (drives flutter wobble)
──────────────────────────────────────────────────── -->
<script id="fragmentShaderPosition" type="x-shader/x-fragment">
  uniform float time;
  uniform float delta;

  void main() {
    vec2 uv = gl_FragCoord.xy / resolution.xy;
    vec4 tmpPos  = texture2D( texturePosition, uv );
    vec3 position = tmpPos.xyz;
    vec3 velocity = texture2D( textureVelocity, uv ).xyz;

    float phase = tmpPos.w;

    // Phase advances with speed – drives the wobble intensity in the vertex shader.
    // When settled (speed ≈ 0) phase stops advancing; wobble amplitude is also 0.
    phase = mod( phase + delta * length( velocity ) * 0.5, 62.83 );

    gl_FragColor = vec4( position + velocity * delta * 15.0, phase );
  }
</script>

<!-- ─────────────────────────────────────────────────
     GPGPU: Velocity update shader
     Flocking (separation / alignment / cohesion) blended
     with a homing force toward each boid's target position.
──────────────────────────────────────────────────── -->
<script id="fragmentShaderVelocity" type="x-shader/x-fragment">
  uniform float time;
  uniform float delta;
  uniform float separationDistance;
  uniform float alignmentDistance;
  uniform float cohesionDistance;
  uniform float freedomFactor;
  uniform vec3  predator;

  // Settling uniforms
  uniform float settlingFactor;        // 0 = pure flocking, 1 = fully homing
  uniform sampler2D textureTarget;     // target position per boid (same dims as position/velocity)
  uniform float appState;              // 0=SWARM, 1=UTAH_MAP, 2=UTAH_SPRINGS, 3=STAGE, 4=SECTOR, 5=COMPANY_SIZE, 6=TRANSITION
  uniform sampler2D textureNeighbors;  // UTAH_SPRINGS: 3 fixed geographic neighbor indices per boid (RGB)
  uniform float springRestLength;      // UTAH_SPRINGS: natural spring length (world units)
  uniform sampler2D textureSector;          // RGB = sector colour, A = sector ID (0–6, −1 = non-company)
  uniform vec2 sectorCentroids[7];          // world-space centroid per sector, updated from JS each frame
  uniform vec2 sectorLabelPositions[7];     // world-space label position per sector (JS spring physics)
  uniform sampler2D textureBucket;          // RGB = size-bucket colour, A = bucket ID (0–5, −1 = non-company)
  uniform vec2 bucketCentroids[6];          // world-space centroid per size bucket, updated from JS each frame
  uniform vec2 bucketLabelPositions[6];     // world-space label position per size bucket
  uniform sampler2D textureStage;           // RGB = stage colour, A = stage ID (0–7, −1 = non-company)
  uniform vec2 stageCentroids[8];           // world-space centroid per VC stage, updated from JS each frame
  uniform vec2 stageLabelPositions[8];        // world-space label position per VC stage
  uniform sampler2D textureNeighborhood;      // RGB = neighborhood colour, A = neighborhood ID (0-7, -1 = non-company)
  uniform vec2 neighborhoodCentroids[8];      // world-space centroid per neighborhood
  uniform vec2 neighborhoodLabelPositions[8]; // world-space label position per neighborhood (Location filter)

  // Boids flee their cluster's floating label — radius sized to label screen footprint (~150×30 px)
  const float LABEL_REPEL_RADIUS = 35.0;
  const float LABEL_REPEL_STR    = 200.0;

  const float width  = resolution.x;
  const float height = resolution.y;

  const float PI   = 3.141592653589793;
  const float PI_2 = PI * 2.0;

  float zoneRadius        = 40.0;
  float zoneRadiusSquared = 1600.0;
  float separationThresh  = 0.45;
  float alignmentThresh   = 0.65;

  const float UPPER_BOUNDS = BOUNDS;
  const float SPEED_LIMIT  = 9.0;

  void main() {
    zoneRadius        = separationDistance + alignmentDistance + cohesionDistance;
    separationThresh  = separationDistance / zoneRadius;
    alignmentThresh   = ( separationDistance + alignmentDistance ) / zoneRadius;
    zoneRadiusSquared = zoneRadius * zoneRadius;

    vec2 uv = gl_FragCoord.xy / resolution.xy;

    vec3 selfPosition = texture2D( texturePosition, uv ).xyz;
    vec3 selfVelocity = texture2D( textureVelocity, uv ).xyz;

    // w=2.0 → company boid (reacts to mouse); w=0.0 → outline boid (locks in place)
    float isCompany = step( 1.5, texture2D( textureTarget, uv ).w );

    vec3 birdPosition, birdVelocity;
    float dist, distSquared, f, percent;
    vec3 dir;

    vec3 velocity = selfVelocity;
    float limit   = SPEED_LIMIT;

    // ── Mouse / cursor interaction (state-dependent) ───────────────────────
    float targetSpacing  = 18.0;            // ~2 hex diameters (HEX_RADIUS = 4.5)
    vec3  cursorWorld    = predator * UPPER_BOUNDS;
    cursorWorld.z        = 0.0;
    float selfCursorDist = length( selfPosition.xy - cursorWorld.xy );

    // SWARM: mouse is a predator — all boids flee from it
    if ( appState < 0.5 ) {
      if ( selfCursorDist > 0.001 && selfCursorDist < 150.0 ) {
        vec3 fleeDir = selfPosition - cursorWorld;
        fleeDir.z = 0.0;
        float fleePower = ( 1.0 - selfCursorDist / 150.0 );
        velocity += normalize( fleeDir ) * delta * 40.0 * fleePower;
      }
    }

    // UTAH_MAP+: cursor spreads overlapping company boids so each is individually visible
    float cursorRadius   = mix( 150.0, 45.0, settlingFactor );  // shrinks to tight zone when settled
    float selfNearCursor = smoothstep( cursorRadius, 0.0, selfCursorDist );
    bool  doCursorSpread = ( appState > 0.5 && isCompany > 0.5 && selfNearCursor > 0.001 );

    // ── UTAH_SPRINGS (neighborhood): spring toward neighborhood centroid ────
    if ( appState > 1.5 && appState < 2.5 && isCompany > 0.5 ) {
      float nid = texture2D( textureNeighborhood, uv ).a;
      if ( nid >= 0.0 ) {
        int n = int( nid + 0.5 );
        vec2 nc = vec2( 0.0 );
        if      ( n == 0 ) nc = neighborhoodCentroids[ 0 ];
        else if ( n == 1 ) nc = neighborhoodCentroids[ 1 ];
        else if ( n == 2 ) nc = neighborhoodCentroids[ 2 ];
        else if ( n == 3 ) nc = neighborhoodCentroids[ 3 ];
        else if ( n == 4 ) nc = neighborhoodCentroids[ 4 ];
        else if ( n == 5 ) nc = neighborhoodCentroids[ 5 ];
        else if ( n == 6 ) nc = neighborhoodCentroids[ 6 ];
        else if ( n == 7 ) nc = neighborhoodCentroids[ 7 ];
        vec3 toCentroid = vec3( nc, 0.0 ) - selfPosition;
        float d = length( toCentroid );
        if ( d > 0.001 ) velocity += normalize( toCentroid ) * 0.4 * d * delta;
      }
    }

    // ── STAGE: spring toward centroid ────────────────────────────────────────
    if ( appState > 2.5 && appState < 3.5 && isCompany > 0.5 ) {
      float tid = texture2D( textureStage, uv ).a;
      if ( tid >= 0.0 ) {
        int t = int( tid + 0.5 );
        vec2 sc = vec2( 0.0 );
        if      ( t == 0 ) sc = stageCentroids[ 0 ];
        else if ( t == 1 ) sc = stageCentroids[ 1 ];
        else if ( t == 2 ) sc = stageCentroids[ 2 ];
        else if ( t == 3 ) sc = stageCentroids[ 3 ];
        else if ( t == 4 ) sc = stageCentroids[ 4 ];
        else if ( t == 5 ) sc = stageCentroids[ 5 ];
        else if ( t == 6 ) sc = stageCentroids[ 6 ];
        else if ( t == 7 ) sc = stageCentroids[ 7 ];
        vec3 toCentroid = vec3( sc, 0.0 ) - selfPosition;
        float d = length( toCentroid );
        if ( d > 0.001 ) velocity += normalize( toCentroid ) * 0.4 * d * delta;
      }
    }

    // ── SECTOR: spring toward centroid ────────────────────────────────────────
    if ( appState > 3.5 && appState < 4.5 && isCompany > 0.5 ) {
      float sid = texture2D( textureSector, uv ).a;
      if ( sid >= 0.0 ) {
        int s = int( sid + 0.5 );
        vec2 sc = vec2( 0.0 );
        if      ( s == 0 ) sc = sectorCentroids[ 0 ];
        else if ( s == 1 ) sc = sectorCentroids[ 1 ];
        else if ( s == 2 ) sc = sectorCentroids[ 2 ];
        else if ( s == 3 ) sc = sectorCentroids[ 3 ];
        else if ( s == 4 ) sc = sectorCentroids[ 4 ];
        else if ( s == 5 ) sc = sectorCentroids[ 5 ];
        else if ( s == 6 ) sc = sectorCentroids[ 6 ];
        vec3 toCentroid = vec3( sc, 0.0 ) - selfPosition;
        float d = length( toCentroid );
        if ( d > 0.001 ) velocity += normalize( toCentroid ) * 0.4 * d * delta;
      }
    }

    // ── COMPANY_SIZE: spring toward centroid ──────────────────────────────────
    if ( appState > 4.5 && appState < 5.5 && isCompany > 0.5 ) {
      float bid = texture2D( textureBucket, uv ).a;
      if ( bid >= 0.0 ) {
        int b = int( bid + 0.5 );
        vec2 bc = vec2( 0.0 );
        if      ( b == 0 ) bc = bucketCentroids[ 0 ];
        else if ( b == 1 ) bc = bucketCentroids[ 1 ];
        else if ( b == 2 ) bc = bucketCentroids[ 2 ];
        else if ( b == 3 ) bc = bucketCentroids[ 3 ];
        else if ( b == 4 ) bc = bucketCentroids[ 4 ];
        else if ( b == 5 ) bc = bucketCentroids[ 5 ];
        vec3 toCentroid = vec3( bc, 0.0 ) - selfPosition;
        float d = length( toCentroid );
        if ( d > 0.001 ) velocity += normalize( toCentroid ) * 0.4 * d * delta;
      }
    }

    // ── Label repulsion: ALL company boids flee every label in the active state ─
    // Applied outside the per-category blocks so every boid, not just its own
    // colour group, clears space around all floating labels.
    if ( isCompany > 0.5 ) {
      vec3 fl; float ld;
      if ( appState > 1.5 && appState < 2.5 ) {
        for ( int i = 0; i < 8; i++ ) {
          fl = selfPosition - vec3( neighborhoodLabelPositions[ i ], 0.0 );
          ld = length( fl.xy );
          if ( ld > 0.001 && ld < LABEL_REPEL_RADIUS )
            velocity += vec3( fl.xy / ld, 0.0 ) * ( 1.0 - ld / LABEL_REPEL_RADIUS ) * delta * LABEL_REPEL_STR;
        }
      }
      if ( appState > 2.5 && appState < 3.5 ) {
        for ( int i = 0; i < 8; i++ ) {
          fl = selfPosition - vec3( stageLabelPositions[ i ], 0.0 );
          ld = length( fl.xy );
          if ( ld > 0.001 && ld < LABEL_REPEL_RADIUS )
            velocity += vec3( fl.xy / ld, 0.0 ) * ( 1.0 - ld / LABEL_REPEL_RADIUS ) * delta * LABEL_REPEL_STR;
        }
      }
      if ( appState > 3.5 && appState < 4.5 ) {
        for ( int i = 0; i < 7; i++ ) {
          fl = selfPosition - vec3( sectorLabelPositions[ i ], 0.0 );
          ld = length( fl.xy );
          if ( ld > 0.001 && ld < LABEL_REPEL_RADIUS )
            velocity += vec3( fl.xy / ld, 0.0 ) * ( 1.0 - ld / LABEL_REPEL_RADIUS ) * delta * LABEL_REPEL_STR;
        }
      }
      if ( appState > 4.5 && appState < 5.5 ) {
        for ( int i = 0; i < 6; i++ ) {
          fl = selfPosition - vec3( bucketLabelPositions[ i ], 0.0 );
          ld = length( fl.xy );
          if ( ld > 0.001 && ld < LABEL_REPEL_RADIUS )
            velocity += vec3( fl.xy / ld, 0.0 ) * ( 1.0 - ld / LABEL_REPEL_RADIUS ) * delta * LABEL_REPEL_STR;
        }
      }
    }

    // ── Central attraction (fades out as settling increases) ───────────────
    float centralStrength = 1.0 - settlingFactor;
    dir = selfPosition;
    dir.y *= 2.5;
    if ( length( dir ) > 0.1 ) {
      velocity -= normalize( dir ) * delta * 5.0 * centralStrength;
    }

    // ── Flocking + cursor spread + spring repulsion (single neighbour pass) ─
    float flockWeight   = 1.0 - settlingFactor;
    bool  doNeighborhoodRepel = ( appState > 1.5 && appState < 2.5 && isCompany > 0.5 );
    float neighborhoodRepelR  = springRestLength * 1.5;
    bool  doSectorRepel  = ( appState > 3.5 && appState < 4.5 && isCompany > 0.5 );
    float sectorRepelR   = springRestLength * 1.5;
    bool  doBucketRepel  = ( appState > 4.5 && appState < 5.5 && isCompany > 0.5 );
    float bucketRepelR   = springRestLength * 1.5;
    bool  doStageRepel   = ( appState > 2.5 && appState < 3.5 && isCompany > 0.5 );
    float stageRepelR    = springRestLength * 1.5;

    if ( flockWeight > 0.001 || doCursorSpread || doNeighborhoodRepel || doSectorRepel || doBucketRepel || doStageRepel ) {
      for ( float y = 0.0; y < height; y++ ) {
        for ( float x = 0.0; x < width; x++ ) {

          vec2 ref = vec2( x + 0.5, y + 0.5 ) / resolution.xy;
          birdPosition = texture2D( texturePosition, ref ).xyz;

          dir = birdPosition - selfPosition;
          dist = length( dir );
          if ( dist < 0.0001 ) continue;
          distSquared = dist * dist;

          float xyDist       = length( dir.xy );
          bool  inFlockZone       = ( distSquared <= zoneRadiusSquared );
          bool  inSpreadZone      = ( doCursorSpread && xyDist > 0.001 && xyDist < targetSpacing );
          bool  inRepelZone       = ( doNeighborhoodRepel && xyDist > 0.001 && xyDist < neighborhoodRepelR );
          bool  inSectorRepelZone = ( doSectorRepel  && xyDist > 0.001 && xyDist < sectorRepelR );
          bool  inBucketRepelZone = ( doBucketRepel  && xyDist > 0.001 && xyDist < bucketRepelR );
          bool  inStageRepelZone  = ( doStageRepel   && xyDist > 0.001 && xyDist < stageRepelR  );

          if ( !inFlockZone && !inSpreadZone && !inRepelZone && !inSectorRepelZone && !inBucketRepelZone && !inStageRepelZone ) continue;

          // ── Cursor spread: repel neighbours closer than 2 hex diameters ──
          if ( inSpreadZone ) {
            float repelStr = ( 1.0 - xyDist / targetSpacing ) * selfNearCursor * delta * 50.0;
            velocity += normalize( vec3( -dir.x, -dir.y, 0.0 ) ) * repelStr;
          }

          // ── UTAH_SPRINGS (neighborhood): short-range repulsion ───────────
          if ( inRepelZone ) {
            float repelStr = ( 1.0 - xyDist / neighborhoodRepelR ) * delta * 60.0;
            velocity -= normalize( vec3( dir.x, dir.y, 0.0 ) ) * repelStr;
          }

          // ── SECTOR: short-range repulsion keeps boids within a cluster spread ──
          if ( inSectorRepelZone ) {
            float repelStr = ( 1.0 - xyDist / sectorRepelR ) * delta * 60.0;
            velocity -= normalize( vec3( dir.x, dir.y, 0.0 ) ) * repelStr;
          }

          // ── COMPANY_SIZE: short-range repulsion within size bucket ────────
          if ( inBucketRepelZone ) {
            float repelStr = ( 1.0 - xyDist / bucketRepelR ) * delta * 60.0;
            velocity -= normalize( vec3( dir.x, dir.y, 0.0 ) ) * repelStr;
          }

          // ── STAGE: short-range repulsion within stage cluster ─────────────
          if ( inStageRepelZone ) {
            float repelStr = ( 1.0 - xyDist / stageRepelR ) * delta * 60.0;
            velocity -= normalize( vec3( dir.x, dir.y, 0.0 ) ) * repelStr;
          }

          // ── Flocking: separation / alignment / cohesion ────────────────
          if ( inFlockZone && flockWeight > 0.001 ) {
            percent = distSquared / zoneRadiusSquared;

            if ( percent < separationThresh ) {
              f = ( separationThresh / percent - 1.0 ) * delta * flockWeight;
              velocity -= normalize( dir ) * f;

            } else if ( percent < alignmentThresh ) {
              birdVelocity = texture2D( textureVelocity, ref ).xyz;
              float bvLen = length( birdVelocity );
              if ( bvLen > 0.001 ) {
                float threshDelta     = alignmentThresh - separationThresh;
                float adjustedPercent = ( percent - separationThresh ) / threshDelta;
                f = ( 0.5 - cos( adjustedPercent * PI_2 ) * 0.5 + 0.5 ) * delta * flockWeight;
                velocity += ( birdVelocity / bvLen ) * f;
              }

            } else {
              float threshDelta = 1.0 - alignmentThresh;
              float adjustedPercent;
              if ( threshDelta == 0.0 ) adjustedPercent = 1.0;
              else adjustedPercent = ( percent - alignmentThresh ) / threshDelta;
              f = ( 0.5 - ( cos( adjustedPercent * PI_2 ) * -0.5 + 0.5 ) ) * delta * flockWeight;
              velocity += normalize( dir ) * f;
            }
          }
        }
      }
    }

    // ── Homing force toward assigned target ────────────────────────────────
    // Skipped for company boids in UTAH_SPRINGS — springs determine their layout.
    // Outline boids always home so the Utah border stays fixed.
    bool shouldHome = settlingFactor > 0.0
      && !( appState > 1.5 && appState < 5.5 && isCompany > 0.5 );
    if ( shouldHome ) {
      vec3 targetPos  = texture2D( textureTarget, uv ).xyz;
      vec3 toTarget   = targetPos - selfPosition;
      float distToTgt = length( toTarget );

      // Proportional-approach force: strong when far, gentle when close.
      // Guard against normalize(vec3(0)) when the boid is exactly at target.
      if ( distToTgt > 0.01 ) {
        float homingStrength = 60.0;
        vec3 homingAccel = normalize( toTarget ) * min( distToTgt * 1.2, homingStrength ) * settlingFactor;
        velocity += homingAccel * delta;
      }

      // Arrival damping: tight braking zone so boids approach fast then stop cleanly.
      float arrivalRadius = 10.0;
      float maxDamp = mix( 0.08, 0.28, settlingFactor );
      float dampAmt = ( 1.0 - smoothstep( 0.0, arrivalRadius, distToTgt ) ) * maxDamp;
      velocity *= ( 1.0 - dampAmt );
    }

    // ── Speed limit (tightens as settling grows; spring state gets own cap) ──
    float effectiveLimit = ( appState > 1.5 && appState < 5.5 )
      ? 5.0
      : mix( limit, 5.5, settlingFactor * settlingFactor );
    if ( length( velocity ) > effectiveLimit ) {
      velocity = normalize( velocity ) * effectiveLimit;
    }

    // ── Damping / friction ─────────────────────────────────────────────────
    if ( appState > 1.5 && appState < 5.5 ) {
      // UTAH_SPRINGS / STAGE / SECTOR / COMPANY_SIZE: overdamped so layout converges without oscillating.
      velocity *= ( 1.0 - 8.0 * delta );

<!-- ─────────────────────────────────────────────────
     Hexagon vertex shader
     Billboards each hex to face the camera, with a
     speed-proportional leaf-flutter wobble.
──────────────────────────────────────────────────── -->
<script id="hexVS" type="x-shader/x-vertex">
  attribute vec2 reference;   // UV into GPGPU textures for this hex
  attribute float hexVertex;  // 0..17 – vertex index within one hexagon
  attribute vec3 birdColor;

  uniform sampler2D texturePosition;
  uniform sampler2D textureVelocity;
  uniform sampler2D textureSector;  // RGB = sector colour, A = sector ID
  uniform float sectorBlend;        // 0 = original birdColor, 1 = sector colour
  uniform sampler2D textureBucket;  // RGB = size-bucket colour, A = bucket ID
  uniform float bucketBlend;        // 0 = no bucket tint, 1 = bucket colour
  uniform sampler2D textureStage;        // RGB = stage colour, A = stage ID
  uniform float stageBlend;              // 0 = no stage tint, 1 = stage colour
  uniform sampler2D textureNeighborhood; // RGB = neighborhood colour, A = neighborhood ID
  uniform float neighborhoodBlend;       // 0 = no neighborhood tint, 1 = neighborhood colour
  uniform float clusterScale;            // ramps 0→1 in clustering states; company boids scale 1→1.5×
  uniform float time;

  varying vec4 vColor;
  varying float z;

  void main() {
    vec4 tmpPos = texture2D( texturePosition, reference );
    vec3 pos    = tmpPos.xyz;
    float phase = tmpPos.w;

    vec3 vel   = texture2D( textureVelocity, reference ).xyz;
    float speed = length( vel );
    // Normalize to [0,1] against SPEED_LIMIT 9.0; wobble is zero when settled
    float speedNorm = clamp( speed / 9.0, 0.0, 1.0 );

    // ── Billboard basis from view matrix ──────────────────────────────────
    // Each row of the view matrix is a world-space camera axis.
    vec3 camRight = normalize( vec3( viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0] ) );
    vec3 camUp    = normalize( vec3( viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1] ) );
    // row 2 points INTO the scene (−camForward by Three.js convention)
    vec3 camFwd   = normalize( vec3( viewMatrix[0][2], viewMatrix[1][2], viewMatrix[2][2] ) );

    // ── Leaf-flutter wobble (scales to zero as speed → 0) ────────────────
    float wobbleAmp = 0.65 * speedNorm;
    float tiltV = sin( phase * 2.3 ) * wobbleAmp;           // vertical tilt
    float tiltH = cos( phase * 1.7 ) * wobbleAmp * 0.6;     // horizontal tilt

    vec3 tiltedRight = normalize( camRight + camFwd * tiltH );
    vec3 tiltedUp    = normalize( camUp    + camFwd * tiltV );

    // ── Billboard transform: place hex vertices around world-space pos ────
    // Company boids (textureSector.a >= 0) scale up to 1.5× in clustering states.
    float isCompanyVS = step( 0.0, texture2D( textureSector, reference ).a );
    float boidScale   = 1.0 + 0.5 * isCompanyVS * clusterScale;
    vec3 worldPos = pos + tiltedRight * position.x * boidScale + tiltedUp * position.y * boidScale;

    z = worldPos.z;
    vec3 secCol    = texture2D( textureSector,       reference ).rgb;
    vec3 bucketCol = texture2D( textureBucket,       reference ).rgb;
    vec3 stageCol  = texture2D( textureStage,        reference ).rgb;
    vec3 neighCol  = texture2D( textureNeighborhood, reference ).rgb;
    vec3 tinted    = mix( birdColor, secCol,    sectorBlend );
         tinted    = mix( tinted,    bucketCol, bucketBlend );
         tinted    = mix( tinted,    stageCol,  stageBlend  );
         tinted    = mix( tinted,    neighCol,  neighborhoodBlend );
    vColor = vec4( tinted, 1.0 );
    gl_Position = projectionMatrix * viewMatrix * vec4( worldPos, 1.0 );
  }
</script>

<!-- ─────────────────────────────────────────────────
     Hexagon fragment shader
──────────────────────────────────────────────────── -->
<script id="hexFS" type="x-shader/x-fragment">
  varying vec4 vColor;
  varying float z;

  void main() {
    // Simple depth-brightening: hexes further from camera appear slightly brighter
    float depth = 0.35 + clamp( ( 800.0 - z ) / 800.0, 0.0, 1.0 ) * 0.65;
    gl_FragColor = vec4( vColor.rgb * depth, 1.0 );
  }
</script>

const LON_CENTER = UTAH_CORNERS_LATLON.reduce( ( s, c ) => s + c[1], 0 ) / UTAH_CORNERS_LATLON.length;

/**
 * Generate `count` evenly-spaced points along Utah's outline polygon.
 * Edge lengths are measured in the corrected (projected) coordinate space
 * so that density is visually uniform regardless of orientation.
 */
function generateUtahOutlinePoints( count ) {
  const corners2D = UTAH_CORNERS_LATLON.map( ( [ lat, lon ] ) => project( lat, lon ) );

  // Build edges with their corrected lengths
  const edges = [];
  let totalLen = 0;
  for ( let i = 0; i < corners2D.length; i++ ) {
    const a   = corners2D[ i ];
    const b   = corners2D[ ( i + 1 ) % corners2D.length ];
    const dx  = b[ 0 ] - a[ 0 ];
    const dy  = b[ 1 ] - a[ 1 ];
    const len = Math.sqrt( dx * dx + dy * dy );
    edges.push( { a, b, len } );
    totalLen += len;
  }

  // Distribute points proportionally to each edge's length
  const pts = [];
  for ( const edge of edges ) {
    const numOnEdge = Math.max( 1, Math.round( ( edge.len / totalLen ) * count ) );
    for ( let i = 0; i < numOnEdge; i++ ) {
      const t = ( i + 0.5 ) / numOnEdge;
      pts.push( [
        edge.a[ 0 ] + t * ( edge.b[ 0 ] - edge.a[ 0 ] ),
        edge.a[ 1 ] + t * ( edge.b[ 1 ] - edge.a[ 1 ] ),
        0, // formation sits on the z = 0 plane
      ] );
    }
  }

  // Trim or repeat-pad to exactly `count`
  while ( pts.length > count ) pts.pop();
  while ( pts.length < count ) pts.push( [ ...pts[ pts.length - 1 ] ] );

  return pts;
}

// ─────────────────────────────────────────────────────────────────────────────
// Hexagon BufferGeometry
// All BIRDS hexagons packed into a single geometry (same pattern as the
// original BirdGeometry).  Each hexagon is 6 triangles (fan from centre),
// 18 vertices total.  The `reference` attribute stores the GPGPU UV for
// each vertex's owning boid.
// ─────────────────────────────────────────────────────────────────────────────
class HexGeometry extends THREE.BufferGeometry {
  constructor( companyCount = 0 ) {
    super();

    const TRIS_PER_HEX  = 6;
    const VERTS_PER_HEX = TRIS_PER_HEX * 3; // 18
    const totalVerts    = BIRDS * VERTS_PER_HEX;

    const positions  = new Float32Array( totalVerts * 3 );
    const birdColors = new Float32Array( totalVerts * 3 );
    const references = new Float32Array( totalVerts * 2 );
    const hexVertex  = new Float32Array( totalVerts );

    // Pre-compute the 18 local vertices for one flat hexagon (XY plane, z = 0).
    // Triangle fan: (centre, v_i, v_{i+1}) for i = 0..5
    const localHex = [];
    for ( let i = 0; i < 6; i++ ) {
      const a0 = ( i / 6 ) * Math.PI * 2;
      const a1 = ( ( i + 1 ) / 6 ) * Math.PI * 2;
      // centre
      localHex.push( 0, 0, 0 );
      // v_i
      localHex.push( HEX_RADIUS * Math.cos( a0 ), HEX_RADIUS * Math.sin( a0 ), 0 );
      // v_{i+1}
      localHex.push( HEX_RADIUS * Math.cos( a1 ), HEX_RADIUS * Math.sin( a1 ), 0 );
    }

    let vi = 0; // flat vertex counter

    for ( let b = 0; b < BIRDS; b++ ) {
      // GPGPU texture UV for this boid
      const bx = b % TEXTURE_WIDTH;
      const by = Math.floor( b / TEXTURE_WIDTH );
      const u  = ( bx + 0.5 ) / TEXTURE_WIDTH;
      const v  = ( by + 0.5 ) / TEXTURE_HEIGHT;

      // Company boids: amber-to-gold gradient. Outline boids: blue-to-teal-to-indigo gradient.
      const isCompany = b < companyCount;
      const companyT  = companyCount > 1 ? b / ( companyCount - 1 ) : 0;
      const col = isCompany
        ? new THREE.Color().setHSL( 0.10 + companyT * 0.05, 0.95, 0.42 + companyT * 0.20 )
        : new THREE.Color().setHSL( 0.57 + ( ( b - companyCount ) / Math.max( 1, BIRDS - companyCount ) ) * 0.08, 0.75, 0.45 + ( ( b - companyCount ) / Math.max( 1, BIRDS - companyCount ) ) * 0.25 );

      for ( let hv = 0; hv < VERTS_PER_HEX; hv++ ) {
        positions[ vi * 3 + 0 ] = localHex[ hv * 3 + 0 ];
        positions[ vi * 3 + 1 ] = localHex[ hv * 3 + 1 ];
        positions[ vi * 3 + 2 ] = localHex[ hv * 3 + 2 ];

        birdColors[ vi * 3 + 0 ] = col.r;
        birdColors[ vi * 3 + 1 ] = col.g;
        birdColors[ vi * 3 + 2 ] = col.b;

        references[ vi * 2 + 0 ] = u;
        references[ vi * 2 + 1 ] = v;

        hexVertex[ vi ] = hv;
        vi++;
      }
    }

    this.setAttribute( 'position',  new THREE.BufferAttribute( positions,  3 ) );
    this.setAttribute( 'birdColor', new THREE.BufferAttribute( birdColors, 3 ) );
    this.setAttribute( 'reference', new THREE.BufferAttribute( references, 2 ) );
    this.setAttribute( 'hexVertex', new THREE.BufferAttribute( hexVertex,  1 ) );
  }
}

  tooltipLogo.style.width  = size + 'px';
  tooltipLogo.style.height = size + 'px';

  if ( co.logoUrl && tooltipLogo.dataset.loadedSrc !== co.logoUrl ) {
    tooltipLogo.dataset.loadedSrc = co.logoUrl;
    tooltipLogo.style.display     = '';
    tooltipLogo.src               = co.logoUrl;
    tooltipLogo.onerror           = () => { tooltipLogo.style.display = 'none'; };
    tooltipLogo.onload            = () => { tooltipLogo.style.display = ''; };
  } else if ( !co.logoUrl ) {
    tooltipLogo.style.display = 'none';
  }

  tooltipName.textContent = co.startup_name;
  tooltipEl.style.left    = pos.x + 'px';
  tooltipEl.style.top     = pos.y + 'px';
  tooltipEl.style.display = 'flex';
}

// ─────────────────────────────────────────────────────────────────────────────
// GPGPU setup
// ─────────────────────────────────────────────────────────────────────────────
function initGPGPU( companies ) {
  gpuCompute = new GPUComputationRenderer( TEXTURE_WIDTH, TEXTURE_HEIGHT, renderer );

  const dtPos = gpuCompute.createTexture();
  const dtVel = gpuCompute.createTexture();
  fillPositionTexture( dtPos );
  fillVelocityTexture( dtVel );

  velocityVariable = gpuCompute.addVariable(
    'textureVelocity',
    document.getElementById( 'fragmentShaderVelocity' ).textContent,
    dtVel
  );
  positionVariable = gpuCompute.addVariable(
    'texturePosition',
    document.getElementById( 'fragmentShaderPosition' ).textContent,
    dtPos
  );

  gpuCompute.setVariableDependencies( velocityVariable, [ positionVariable, velocityVariable ] );
  gpuCompute.setVariableDependencies( positionVariable, [ positionVariable, velocityVariable ] );

  positionUniforms = positionVariable.material.uniforms;
  velocityUniforms = velocityVariable.material.uniforms;

  positionUniforms[ 'time'  ] = { value: 0.0 };
  positionUniforms[ 'delta' ] = { value: 0.0 };

  velocityUniforms[ 'time'                ] = { value: 0.0 };
  velocityUniforms[ 'delta'               ] = { value: 0.0 };
  velocityUniforms[ 'separationDistance'  ] = { value: 20.0 };
  velocityUniforms[ 'alignmentDistance'   ] = { value: 20.0 };
  velocityUniforms[ 'cohesionDistance'    ] = { value: 20.0 };
  velocityUniforms[ 'freedomFactor'       ] = { value: 0.75 };
  velocityUniforms[ 'predator'            ] = { value: new THREE.Vector3() };
  velocityUniforms[ 'settlingFactor'      ] = { value: 0.0 };
  velocityUniforms[ 'appState'            ] = { value: APP_STATE.SWARM };
  velocityUniforms[ 'textureTarget'       ] = { value: buildTargetTexture( companies ) };
  velocityUniforms[ 'textureNeighbors'    ] = { value: buildNeighborTexture( companies ) };

  // Rest length: sqrt of projected Utah area per company so spacing scales with count
  const companyCount    = Math.min( companies.length, BIRDS );
  const UTAH_AREA_APPROX = 311 * 400 * 0.75; // scene-unit² (rect × ~75% fill)
  const springRestLength = companyCount > 1 ? Math.sqrt( UTAH_AREA_APPROX / companyCount ) : 25;
  velocityUniforms[ 'springRestLength'    ] = { value: springRestLength };
  velocityUniforms[ 'textureSector'          ] = { value: buildSectorTexture( companies ) };
  velocityUniforms[ 'sectorCentroids'        ] = { value: sectorCentroidsWorld };
  velocityUniforms[ 'sectorLabelPositions'   ] = { value: sectorLabelPos };
  velocityUniforms[ 'textureBucket'          ] = { value: buildBucketTexture( companies ) };
  velocityUniforms[ 'bucketCentroids'        ] = { value: bucketCentroidsWorld };
  velocityUniforms[ 'bucketLabelPositions'   ] = { value: bucketLabelPos };
  velocityUniforms[ 'textureStage'           ] = { value: buildStageTexture( companies ) };
  velocityUniforms[ 'stageCentroids'         ] = { value: stageCentroidsWorld };
  velocityUniforms[ 'stageLabelPositions'         ] = { value: stageLabelPos };
  velocityUniforms[ 'textureNeighborhood'         ] = { value: buildNeighborhoodTexture( companies ) };
  velocityUniforms[ 'neighborhoodCentroids'       ] = { value: neighborhoodCentroidsWorld };
  velocityUniforms[ 'neighborhoodLabelPositions'  ] = { value: neighborhoodLabelPos };

  initSectorCentroids( companies );
  initBucketCentroids( companies );
  initStageCentroids( companies );
  initNeighborhoodCentroids( companies );

  velocityVariable.material.defines.BOUNDS = BOUNDS.toFixed( 2 );

  velocityVariable.wrapS = THREE.RepeatWrapping;
  velocityVariable.wrapT = THREE.RepeatWrapping;
  positionVariable.wrapS = THREE.RepeatWrapping;
  positionVariable.wrapT = THREE.RepeatWrapping;

  const error = gpuCompute.init();
  if ( error !== null ) console.error( 'GPUComputationRenderer error:', error );
}

/**
 * Build the target DataTexture.
 * Boids 0..companies.length-1  → projected company GPS positions.
 * Boids companies.length..BIRDS-1 → Utah outline positions (shuffled).
 */
function buildTargetTexture( companies ) {
  const companyCount = Math.min( companies.length, BIRDS );
  const outlineCount = BIRDS - companyCount;

  const utahPts = generateUtahOutlinePoints( outlineCount );
  shuffle( utahPts );

  const data = new Float32Array( BIRDS * 4 );

  // Company boids – each flies to its GPS coordinate.
  // w=2.0 flags this as a company boid in the velocity shader (reacts to mouse, no anchor lock).
  for ( let i = 0; i < companyCount; i++ ) {
    const [ x, y ] = project( companies[ i ].latitude, companies[ i ].longitude );
    data[ i * 4 + 0 ] = x;
    data[ i * 4 + 1 ] = y;
    data[ i * 4 + 2 ] = 0;
    data[ i * 4 + 3 ] = 2.0;
  }

  // Outline boids – fill the Utah border.
  // w=0.0 flags these as outline boids (anchor-locked once settled, mouse-immune).
  for ( let i = 0; i < outlineCount; i++ ) {
    const pt = utahPts[ i ] ?? [ 0, 0, 0 ];
    data[ ( companyCount + i ) * 4 + 0 ] = pt[ 0 ];
    data[ ( companyCount + i ) * 4 + 1 ] = pt[ 1 ];
    data[ ( companyCount + i ) * 4 + 2 ] = pt[ 2 ];
    data[ ( companyCount + i ) * 4 + 3 ] = 0.0;
  }

  const tex = new THREE.DataTexture(
    data, TEXTURE_WIDTH, TEXTURE_HEIGHT,
    THREE.RGBAFormat, THREE.FloatType
  );
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.needsUpdate = true;
  return tex;
}

/**
 * Build the neighbor DataTexture for UTAH_SPRINGS.
 * For each company boid, stores the indices of its 3 nearest geographic neighbors
 * in the RGB channels (float). Computed once from GPS positions — connections are fixed.
 * Non-company boids get -1 in all channels (no springs).
 */
function buildNeighborTexture( companies ) {
  const companyCount = Math.min( companies.length, BIRDS );
  const data = new Float32Array( BIRDS * 4 );

  const positions = companies.slice( 0, companyCount ).map( c => project( c.latitude, c.longitude ) );

  for ( let i = 0; i < companyCount; i++ ) {
    const [ xi, yi ] = positions[ i ];

    const dists = [];
    for ( let j = 0; j < companyCount; j++ ) {
      if ( j === i ) continue;
      const [ xj, yj ] = positions[ j ];
      dists.push( { j, d: Math.hypot( xi - xj, yi - yj ) } );
    }
    dists.sort( ( a, b ) => a.d - b.d );

    data[ i * 4 + 0 ] = dists.length > 0 ? dists[ 0 ].j : -1;
    data[ i * 4 + 1 ] = dists.length > 1 ? dists[ 1 ].j : -1;
    data[ i * 4 + 2 ] = dists.length > 2 ? dists[ 2 ].j : -1;
    data[ i * 4 + 3 ] = 0.0;
  }

  for ( let i = companyCount; i < BIRDS; i++ ) {
    data[ i * 4 ] = data[ i * 4 + 1 ] = data[ i * 4 + 2 ] = -1.0;
    data[ i * 4 + 3 ] = 0.0;
  }

  const tex = new THREE.DataTexture(
    data, TEXTURE_WIDTH, TEXTURE_HEIGHT,
    THREE.RGBAFormat, THREE.FloatType
  );
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.needsUpdate = true;
  return tex;
}

function buildSectorTexture( companies ) {
  const companyCount = Math.min( companies.length, BIRDS );
  const data = new Float32Array( BIRDS * 4 );

  companySectorIds = [];
  for ( let i = 0; i < companyCount; i++ ) {
    const name = ( companies[ i ].sector || '' ).trim();
    let sid = SECTORS.indexOf( name );
    if ( sid < 0 ) sid = 0;
    companySectorIds.push( sid );
    const col = SECTOR_COLORS[ sid ];
    data[ i * 4 + 0 ] = col[ 0 ];
    data[ i * 4 + 1 ] = col[ 1 ];
    data[ i * 4 + 2 ] = col[ 2 ];
    data[ i * 4 + 3 ] = sid;   // sector ID in alpha
  }
  for ( let i = companyCount; i < BIRDS; i++ ) {
    data[ i * 4 + 0 ] = 0.35;
    data[ i * 4 + 1 ] = 0.47;
    data[ i * 4 + 2 ] = 0.70;
    data[ i * 4 + 3 ] = -1.0;
  }

  const tex = new THREE.DataTexture(
    data, TEXTURE_WIDTH, TEXTURE_HEIGHT,
    THREE.RGBAFormat, THREE.FloatType
  );
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.needsUpdate = true;
  return tex;
}

function initSectorCentroids( companies ) {
  const sums = Array.from( { length: SECTOR_COUNT }, () => ( { x: 0, y: 0, n: 0 } ) );
  for ( let i = 0; i < companySectorIds.length; i++ ) {
    const sid = companySectorIds[ i ];
    if ( sid >= 0 && sid < SECTOR_COUNT && i < companies.length ) {
      const [ x, y ] = project( companies[ i ].latitude, companies[ i ].longitude );
      sums[ sid ].x += x; sums[ sid ].y += y; sums[ sid ].n++;
    }
  }
  for ( let s = 0; s < SECTOR_COUNT; s++ ) {
    if ( sums[ s ].n > 0 ) {
      sectorCentroidsWorld[ s ].set( sums[ s ].x / sums[ s ].n, sums[ s ].y / sums[ s ].n );
      const angle = ( s / SECTOR_COUNT ) * Math.PI * 2;
      sectorLabelPos[ s ].set(
        sectorCentroidsWorld[ s ].x + Math.cos( angle ) * LABEL_TARGET_DIST,
        sectorCentroidsWorld[ s ].y + Math.sin( angle ) * LABEL_TARGET_DIST
      );
    }
  }
}

function initNeighborhoodCentroids( companies ) {
  // Seed centroids from company geographic positions grouped by neighborhood
  const sums = Array.from( { length: NEIGHBORHOOD_COUNT }, () => ( { x: 0, y: 0, n: 0 } ) );
  for ( let i = 0; i < companyNeighborhoodIds.length; i++ ) {
    const nid = companyNeighborhoodIds[ i ];
    if ( nid >= 0 && nid < NEIGHBORHOOD_COUNT && i < companies.length ) {
      const lat = companies[ i ].latitude  ?? NEIGHBORHOODS[ nid ].lat;
      const lon = companies[ i ].longitude ?? NEIGHBORHOODS[ nid ].lon;
      const [ x, y ] = project( lat, lon );
      sums[ nid ].x += x; sums[ nid ].y += y; sums[ nid ].n++;
    }
  }
  for ( let n = 0; n < NEIGHBORHOOD_COUNT; n++ ) {
    if ( sums[ n ].n > 0 ) {
      neighborhoodCentroidsWorld[ n ].set( sums[ n ].x / sums[ n ].n, sums[ n ].y / sums[ n ].n );
    } else {
      // Fall back to the fixed geographic position if no companies in this neighborhood
      neighborhoodCentroidsWorld[ n ].copy( neighborhoodWorldPos[ n ] );
    }
  }
}

function shuffle( arr ) {
  for ( let i = arr.length - 1; i > 0; i-- ) {
    const j = Math.floor( Math.random() * ( i + 1 ) );
    [ arr[ i ], arr[ j ] ] = [ arr[ j ], arr[ i ] ];
  }
}

// Hexagon mesh
// ─────────────────────────────────────────────────────────────────────────────
function initHexMesh( companyCount ) {
  const geometry = new HexGeometry( companyCount );

  hexUniforms = {
    color:           { value: new THREE.Color( 0x4488ff ) },
    texturePosition: { value: null },
    textureVelocity: { value: null },
    textureSector:   { value: velocityUniforms[ 'textureSector' ].value },
    sectorBlend:     { value: 0.0 },
    textureBucket:   { value: velocityUniforms[ 'textureBucket' ].value },
    bucketBlend:     { value: 0.0 },
    textureStage:         { value: velocityUniforms[ 'textureStage'        ].value },
    stageBlend:           { value: 0.0 },
    textureNeighborhood:  { value: velocityUniforms[ 'textureNeighborhood' ].value },
    neighborhoodBlend:    { value: 0.0 },
    clusterScale:         { value: 0.0 },
    time:            { value: 0.0 },
    delta:           { value: 0.0 },
  };

  const material = new THREE.ShaderMaterial( {
    uniforms:       hexUniforms,
    vertexShader:   document.getElementById( 'hexVS' ).textContent,
    fragmentShader: document.getElementById( 'hexFS' ).textContent,
    side:           THREE.DoubleSide,
  } );

  const mesh = new THREE.Mesh( geometry, material );
  mesh.matrixAutoUpdate = false;
  mesh.updateMatrix();
  scene.add( mesh );
}

// ─────────────────────────────────────────────────────────────────────────────
// Initial GPGPU texture fill
// ─────────────────────────────────────────────────────────────────────────────
function fillPositionTexture( tex ) {
  const arr = tex.image.data;
  for ( let k = 0; k < arr.length; k += 4 ) {
    arr[ k + 0 ] = ( Math.random() - 0.5 ) * BOUNDS;
    arr[ k + 1 ] = ( Math.random() - 0.5 ) * BOUNDS;
    arr[ k + 2 ] = ( Math.random() - 0.5 ) * BOUNDS;
    arr[ k + 3 ] = Math.random() * Math.PI * 2; // initial phase
  }
}

function fillVelocityTexture( tex ) {
  const arr = tex.image.data;
  // Give all boids roughly the same initial heading so they flock together
  // immediately rather than scattering in random directions.
  const baseAngle = Math.PI * 0.15; // roughly NE in the XY plane
  const spread    = 0.35;           // radians of angular spread
  for ( let k = 0; k < arr.length; k += 4 ) {
    const angle = baseAngle + ( Math.random() - 0.5 ) * spread;
    const speed = 7 + Math.random() * 2;
    arr[ k + 0 ] = Math.cos( angle ) * speed;
    arr[ k + 1 ] = Math.sin( angle ) * speed;
    arr[ k + 2 ] = ( Math.random() - 0.5 ) * 2;
    arr[ k + 3 ] = 1.0;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Event handlers
// ─────────────────────────────────────────────────────────────────────────────
function onWindowResize() {
  windowHalfX = window.innerWidth  / 2;
  windowHalfY = window.innerHeight / 2;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize( window.innerWidth, window.innerHeight );
}

function onPointerMove( e ) {
  if ( e.isPrimary === false ) return;
  mouseX       = e.clientX - windowHalfX;
  mouseY       = e.clientY - windowHalfY;
  mouseClientX = e.clientX;
  mouseClientY = e.clientY;
}

// ─────────────────────────────────────────────────────────────────────────────
// Label spring physics
// Each label is attracted to its cluster centroid and repelled by same-category
// boids — it settles at the cluster's outer edge where the forces balance.
// ─────────────────────────────────────────────────────────────────────────────
function updateLabelPhysics( pos, vel, centroid, allLabelPos, delta ) {
  const dx   = pos.x - centroid.x;
  const dy   = pos.y - centroid.y;
  const dist = Math.sqrt( dx * dx + dy * dy );

  let fx = 0, fy = 0;

  // Rest-length spring: push outward when closer than target, pull inward when further.
  // This guarantees the label cannot sit at the centroid where force would be zero.
  if ( dist > 0.001 ) {
    const springF = ( dist - LABEL_TARGET_DIST ) * LABEL_SPRING_K;
    fx -= ( dx / dist ) * springF;
    fy -= ( dy / dist ) * springF;
  } else {
    fx += 0.05; // nudge off exact-zero to break symmetry
  }

  // Repulsion between labels of the same type so they spread around their clusters
  // rather than stacking when two cluster centroids are close together.
  for ( let j = 0; j < allLabelPos.length; j++ ) {
    const other = allLabelPos[ j ];
    if ( other === pos ) continue;
    const odx   = pos.x - other.x;
    const ody   = pos.y - other.y;
    const odist = Math.sqrt( odx * odx + ody * ody );
    if ( odist < LABEL_LABEL_REPEL_R && odist > 0.001 ) {
      const f = LABEL_LABEL_REPEL_STR * ( 1.0 - odist / LABEL_LABEL_REPEL_R ) / odist;
      fx += odx * f;
      fy += ody * f;
    }
  }

  vel.x = ( vel.x + fx * delta ) * ( 1.0 - LABEL_DAMPING * delta );
  vel.y = ( vel.y + fy * delta ) * ( 1.0 - LABEL_DAMPING * delta );
  pos.x += vel.x * delta;
  pos.y += vel.y * delta;
}

// ─────────────────────────────────────────────────────────────────────────────
// Animation loop
// ─────────────────────────────────────────────────────────────────────────────
function animate() {
  const now = performance.now();
  if ( startTime === null ) startTime = now;

  let delta = ( now - last ) / 1000;
  if ( delta > 1 ) delta = 1;
  last = now;

  // settlingFactor ramps 0 → 1 over SETTLE_DURATION seconds after the button click.
  // It stays at 0 until the user presses "See Utah Companies".
  const settlingFactor = settlingStartTime === null ? 0 :
    Math.max( 0, Math.min( 1, ( now - settlingStartTime ) / ( SETTLE_DURATION * 1000 ) ) );

  positionUniforms[ 'time'  ].value = now;
  positionUniforms[ 'delta' ].value = delta;

  velocityUniforms[ 'time'           ].value = now;
  velocityUniforms[ 'delta'          ].value = delta;
  velocityUniforms[ 'settlingFactor' ].value = settlingFactor;
  velocityUniforms[ 'appState'       ].value = currentState;
  velocityUniforms[ 'predator'       ].value.set(
     0.5 * mouseX / windowHalfX,
    -0.5 * mouseY / windowHalfY,
     0
  );

  hexUniforms[ 'time'  ].value = now;
  hexUniforms[ 'delta' ].value = delta;

  gpuCompute.compute();

  hexUniforms[ 'texturePosition' ].value =
    gpuCompute.getCurrentRenderTarget( positionVariable ).texture;
  hexUniforms[ 'textureVelocity' ].value =
    gpuCompute.getCurrentRenderTarget( velocityVariable ).texture;

  // Throttled GPU→CPU readback for tooltip hit-testing (~10 fps is plenty)
  if ( companyData.length > 0 && now - lastReadbackTime > 100 ) {
    lastReadbackTime = now;
    const posRT = gpuCompute.getCurrentRenderTarget( positionVariable );
    lastPosPixels = new Float32Array( TEXTURE_WIDTH * TEXTURE_HEIGHT * 4 );
    renderer.readRenderTargetPixels( posRT, 0, 0, TEXTURE_WIDTH, TEXTURE_HEIGHT, lastPosPixels );

    cachedCompanyScreenPos = companyData.map( ( _, i ) => {
      const bx = i % TEXTURE_WIDTH;
      const by = Math.floor( i / TEXTURE_WIDTH );
      const pi = ( by * TEXTURE_WIDTH + bx ) * 4;
      const v  = new THREE.Vector3( lastPosPixels[ pi ], lastPosPixels[ pi + 1 ], lastPosPixels[ pi + 2 ] )
        .project( camera );
      return {
        x: ( v.x + 1 ) / 2 * window.innerWidth,
        y: ( -v.y + 1 ) / 2 * window.innerHeight,
      };
    } );

    // Recompute neighborhood centroids
    if ( currentState === APP_STATE.UTAH_SPRINGS && lastPosPixels ) {
      const sums = Array.from( { length: NEIGHBORHOOD_COUNT }, () => ( { x: 0, y: 0, n: 0 } ) );
      for ( let i = 0; i < companyNeighborhoodIds.length; i++ ) {
        const nid = companyNeighborhoodIds[ i ];
        if ( nid >= 0 && nid < NEIGHBORHOOD_COUNT ) {
          const pi = i * 4;
          sums[ nid ].x += lastPosPixels[ pi ];
          sums[ nid ].y += lastPosPixels[ pi + 1 ];
          sums[ nid ].n++;
        }
      }
      for ( let n = 0; n < NEIGHBORHOOD_COUNT; n++ ) {
        if ( sums[ n ].n > 0 )
          neighborhoodCentroidsWorld[ n ].set( sums[ n ].x / sums[ n ].n, sums[ n ].y / sums[ n ].n );
      }
    }

    // Recompute sector centroids + cache boid positions for label repulsion
    if ( currentState === APP_STATE.SECTOR && lastPosPixels ) {
      const sums = Array.from( { length: SECTOR_COUNT }, () => ( { x: 0, y: 0, n: 0 } ) );
      sectorBoidPositions = Array.from( { length: SECTOR_COUNT }, () => [] );
      for ( let i = 0; i < companySectorIds.length; i++ ) {
        const sid = companySectorIds[ i ];
        if ( sid >= 0 && sid < SECTOR_COUNT ) {
          const pi = i * 4;
          sums[ sid ].x += lastPosPixels[ pi ];
          sums[ sid ].y += lastPosPixels[ pi + 1 ];
          sums[ sid ].n++;
          sectorBoidPositions[ sid ].push( lastPosPixels[ pi ], lastPosPixels[ pi + 1 ] );
        }
      }
      for ( let s = 0; s < SECTOR_COUNT; s++ ) {
        if ( sums[ s ].n > 0 )
          sectorCentroidsWorld[ s ].set( sums[ s ].x / sums[ s ].n, sums[ s ].y / sums[ s ].n );
      }
    }

    // Recompute VC-stage centroids + cache boid positions for label repulsion
    if ( currentState === APP_STATE.STAGE && lastPosPixels ) {
      const sums = Array.from( { length: STAGE_COUNT }, () => ( { x: 0, y: 0, n: 0 } ) );
      stageBoidPositions = Array.from( { length: STAGE_COUNT }, () => [] );
      for ( let i = 0; i < companyStageIds.length; i++ ) {
        const sid = companyStageIds[ i ];
        if ( sid >= 0 && sid < STAGE_COUNT ) {
          const pi = i * 4;
          sums[ sid ].x += lastPosPixels[ pi ];
          sums[ sid ].y += lastPosPixels[ pi + 1 ];
          sums[ sid ].n++;
          stageBoidPositions[ sid ].push( lastPosPixels[ pi ], lastPosPixels[ pi + 1 ] );
        }
      }
      for ( let s = 0; s < STAGE_COUNT; s++ ) {
        if ( sums[ s ].n > 0 )
          stageCentroidsWorld[ s ].set( sums[ s ].x / sums[ s ].n, sums[ s ].y / sums[ s ].n );
      }
    }

    // Recompute size-bucket centroids + cache boid positions for label repulsion
    if ( currentState === APP_STATE.COMPANY_SIZE && lastPosPixels ) {
      const sums = Array.from( { length: BUCKET_COUNT }, () => ( { x: 0, y: 0, n: 0 } ) );
      bucketBoidPositions = Array.from( { length: BUCKET_COUNT }, () => [] );
      for ( let i = 0; i < companyBucketIds.length; i++ ) {
        const bid = companyBucketIds[ i ];
        if ( bid >= 0 && bid < BUCKET_COUNT ) {
          const pi = i * 4;
          sums[ bid ].x += lastPosPixels[ pi ];
          sums[ bid ].y += lastPosPixels[ pi + 1 ];
          sums[ bid ].n++;
          bucketBoidPositions[ bid ].push( lastPosPixels[ pi ], lastPosPixels[ pi + 1 ] );
        }
      }
      for ( let b = 0; b < BUCKET_COUNT; b++ ) {
        if ( sums[ b ].n > 0 )
          bucketCentroidsWorld[ b ].set( sums[ b ].x / sums[ b ].n, sums[ b ].y / sums[ b ].n );
      }
    }
  }

  // Colour blend ramps + cluster size ramp + label positioning (every frame)
  sectorBlendTarget       = ( currentState === APP_STATE.SECTOR        ) ? 1.0 : 0.0;
  bucketBlendTarget       = ( currentState === APP_STATE.COMPANY_SIZE  ) ? 1.0 : 0.0;
  stageBlendTarget        = ( currentState === APP_STATE.STAGE         ) ? 1.0 : 0.0;
  neighborhoodBlendTarget = ( currentState === APP_STATE.UTAH_SPRINGS  ) ? 1.0 : 0.0;
  sectorBlend        += ( sectorBlendTarget       - sectorBlend        ) * Math.min( 1.0, delta * 2.0 );
  bucketBlend        += ( bucketBlendTarget       - bucketBlend        ) * Math.min( 1.0, delta * 2.0 );
  stageBlend         += ( stageBlendTarget        - stageBlend         ) * Math.min( 1.0, delta * 2.0 );
  neighborhoodBlend  += ( neighborhoodBlendTarget - neighborhoodBlend  ) * Math.min( 1.0, delta * 2.0 );
  const clusterScaleTarget = ( currentState > APP_STATE.UTAH_MAP ) ? 1.0 : 0.0;
  clusterScale += ( clusterScaleTarget - clusterScale ) * Math.min( 1.0, delta * 2.0 );
  hexUniforms[ 'sectorBlend'        ].value = sectorBlend;
  hexUniforms[ 'bucketBlend'        ].value = bucketBlend;
  hexUniforms[ 'stageBlend'         ].value = stageBlend;
  hexUniforms[ 'neighborhoodBlend'  ].value = neighborhoodBlend;
  hexUniforms[ 'clusterScale'       ].value = clusterScale;

  for ( let n = 0; n < neighborhoodLabelEls.length; n++ ) {
    const el = neighborhoodLabelEls[ n ];
    if ( currentState === APP_STATE.UTAH_SPRINGS ) {
      updateLabelPhysics( neighborhoodLabelPos[ n ], neighborhoodLabelVel[ n ],
                          neighborhoodCentroidsWorld[ n ], neighborhoodLabelPos, delta );
      _tmpV3.set( neighborhoodLabelPos[ n ].x, neighborhoodLabelPos[ n ].y, 0 ).project( camera );
      el.style.left = ( ( _tmpV3.x + 1 ) / 2 * window.innerWidth  ) + 'px';
      el.style.top  = ( ( -_tmpV3.y + 1 ) / 2 * window.innerHeight ) + 'px';
      el.classList.add( 'visible' );
    } else {
      el.classList.remove( 'visible' );
    }
  }

  for ( let s = 0; s < sectorLabelEls.length; s++ ) {
    const el = sectorLabelEls[ s ];
    if ( currentState === APP_STATE.SECTOR ) {
      updateLabelPhysics( sectorLabelPos[ s ], sectorLabelVel[ s ],
                          sectorCentroidsWorld[ s ], sectorLabelPos, delta );
      _tmpV3.set( sectorLabelPos[ s ].x, sectorLabelPos[ s ].y, 0 ).project( camera );
      el.style.left = ( ( _tmpV3.x + 1 ) / 2 * window.innerWidth  ) + 'px';
      el.style.top  = ( ( -_tmpV3.y + 1 ) / 2 * window.innerHeight ) + 'px';
      el.classList.add( 'visible' );
    } else {
      el.classList.remove( 'visible' );
    }
  }

  for ( let b = 0; b < bucketLabelEls.length; b++ ) {
    const el = bucketLabelEls[ b ];
    if ( currentState === APP_STATE.COMPANY_SIZE ) {
      updateLabelPhysics( bucketLabelPos[ b ], bucketLabelVel[ b ],
                          bucketCentroidsWorld[ b ], bucketLabelPos, delta );
      _tmpV3.set( bucketLabelPos[ b ].x, bucketLabelPos[ b ].y, 0 ).project( camera );
      el.style.left = ( ( _tmpV3.x + 1 ) / 2 * window.innerWidth  ) + 'px';
      el.style.top  = ( ( -_tmpV3.y + 1 ) / 2 * window.innerHeight ) + 'px';
      el.classList.add( 'visible' );
    } else {
      el.classList.remove( 'visible' );
    }
  }

  for ( let s = 0; s < stageLabelEls.length; s++ ) {
    const el = stageLabelEls[ s ];
    if ( currentState === APP_STATE.STAGE ) {
      updateLabelPhysics( stageLabelPos[ s ], stageLabelVel[ s ],
                          stageCentroidsWorld[ s ], stageLabelPos, delta );
      _tmpV3.set( stageLabelPos[ s ].x, stageLabelPos[ s ].y, 0 ).project( camera );
      el.style.left = ( ( _tmpV3.x + 1 ) / 2 * window.innerWidth  ) + 'px';
      el.style.top  = ( ( -_tmpV3.y + 1 ) / 2 * window.innerHeight ) + 'px';
      el.classList.add( 'visible' );
    } else {
      el.classList.remove( 'visible' );
    }
  }

  updateTooltip( mouseClientX, mouseClientY );

  renderer.render( scene, camera );
}
</script>
